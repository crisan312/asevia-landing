<svg width="320" height="80" viewBox="0 0 320 80" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>ASEVIA — AI · Systems · Advisory</title>
  <desc>Logo oficial ASEVIA para documentos electronicos, RIDEs y uso editorial</desc>
  <defs>
    <linearGradient id="gF1" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="gF2" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#4338CA"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
  </defs>

  <!-- ═══════════════════════════════════════
       ROBOT ICON  (scaled 0.709 → fits 80px tall)
       ═══════════════════════════════════════ -->
  <g transform="translate(9, 1) scale(0.709)">
    <!-- Antenna ball -->
    <circle cx="40" cy="5" r="4.5" fill="url(#gF1)"/>
    <!-- Antenna stem -->
    <rect x="37.5" y="9" width="5" height="10" rx="2.5" fill="url(#gF1)"/>

    <!-- Head -->
    <rect x="9" y="18" width="62" height="37" rx="10" fill="url(#gF1)"/>

    <!-- Left eye -->
    <rect x="13" y="25" width="21" height="15" rx="4" fill="white"/>
    <rect x="18" y="28.5" width="11" height="8" rx="2.5" fill="#312E81"/>
    <circle cx="22.5" cy="31.5" r="2.2" fill="white" fill-opacity="0.6"/>

    <!-- Right eye -->
    <rect x="46" y="25" width="21" height="15" rx="4" fill="white"/>
    <rect x="51" y="28.5" width="11" height="8" rx="2.5" fill="#312E81"/>
    <circle cx="55.5" cy="31.5" r="2.2" fill="white" fill-opacity="0.6"/>

    <!-- Mouth -->
    <rect x="20" y="46" width="40" height="5" rx="2.5" fill="white" fill-opacity="0.82"/>

    <!-- Neck connectors -->
    <rect x="22" y="55" width="11" height="6" rx="2" fill="url(#gF2)"/>
    <rect x="47" y="55" width="11" height="6" rx="2" fill="url(#gF2)"/>

    <!-- Body -->
    <rect x="7" y="60" width="66" height="40" rx="10" fill="url(#gF1)"/>
    <rect x="7" y="60" width="66" height="11" rx="10" fill="white" fill-opacity="0.07"/>

    <!-- IA panel -->
    <rect x="14" y="71" width="52" height="20" rx="5" fill="white" fill-opacity="0.11"/>
    <rect x="14" y="71" width="52" height="20" rx="5" fill="none" stroke="white" stroke-opacity="0.28" stroke-width="1"/>
    <text x="40" y="85.5" text-anchor="middle" font-size="11" font-weight="800"
          font-family="Inter, -apple-system, 'Segoe UI', Arial, sans-serif"
          fill="white" letter-spacing="2.5">IA</text>

    <!-- Arms -->
    <rect x="0" y="63" width="8" height="26" rx="4" fill="url(#gF1)"/>
    <rect x="72" y="63" width="8" height="26" rx="4" fill="url(#gF1)"/>

    <!-- Feet -->
    <rect x="12" y="101" width="22" height="7" rx="3.5" fill="url(#gF2)"/>
    <rect x="46" y="101" width="22" height="7" rx="3.5" fill="url(#gF2)"/>
  </g>

  <!-- ═══════════════════════════════════════
       DIVIDER
       ═══════════════════════════════════════ -->
  <line x1="72" y1="10" x2="72" y2="70" stroke="#C7D2FE" stroke-width="0.8"/>

  <!-- ═══════════════════════════════════════
       SPARKLE DECORATIONS
       ═══════════════════════════════════════ -->
  <!-- 4-pointed star, primary -->
  <path d="M80,22 l2,-5.5 l2,5.5 l5.5,2 l-5.5,2 l-2,5.5 l-2,-5.5 l-5.5,-2 z"
        fill="#4F46E5" opacity="0.65"/>
  <!-- 4-pointed star, small -->
  <path d="M84.5,43 l1.4,-3.5 l1.4,3.5 l3.5,1.4 l-3.5,1.4 l-1.4,3.5 l-1.4,-3.5 l-3.5,-1.4 z"
        fill="#7C3AED" opacity="0.5"/>
  <!-- Accent dots -->
  <circle cx="80" cy="50" r="1.6" fill="#4F46E5" opacity="0.4"/>
  <circle cx="87" cy="35" r="1.1" fill="#7C3AED" opacity="0.35"/>

  <!-- ═══════════════════════════════════════
       WORDMARK + TAGLINE
       ═══════════════════════════════════════ -->
  <text x="97" y="52"
        font-size="48" font-weight="900" letter-spacing="-1"
        font-family="Inter, -apple-system, 'Segoe UI', Arial, sans-serif"
        fill="#0F0E2E">ASEVIA</text>

  <text x="98" y="68"
        font-size="10" font-weight="600" letter-spacing="3"
        font-family="Inter, -apple-system, 'Segoe UI', Arial, sans-serif"
        fill="#4F46E5">AI · SYSTEMS · ADVISORY</text>
</svg>
