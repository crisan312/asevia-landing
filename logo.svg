<svg width="80" height="110" viewBox="0 0 80 110" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ASEVIA">
  <title>ASEVIA</title>
  <desc>Robot mascota ASEVIA — AI Systems Advisory</desc>
  <defs>
    <linearGradient id="gMain" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="gDark" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#4338CA"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
  </defs>

  <!-- Antenna ball -->
  <circle cx="40" cy="5" r="4.5" fill="url(#gMain)"/>
  <!-- Antenna stem -->
  <rect x="37.5" y="9" width="5" height="10" rx="2.5" fill="url(#gMain)"/>

  <!-- Head -->
  <rect x="9" y="18" width="62" height="37" rx="10" fill="url(#gMain)"/>

  <!-- Left eye white sclera -->
  <rect x="13" y="25" width="21" height="15" rx="4" fill="white"/>
  <!-- Left pupil -->
  <rect x="18" y="28.5" width="11" height="8" rx="2.5" fill="#312E81"/>
  <!-- Left eye glint -->
  <circle cx="22.5" cy="31.5" r="2.2" fill="white" fill-opacity="0.6"/>

  <!-- Right eye white sclera -->
  <rect x="46" y="25" width="21" height="15" rx="4" fill="white"/>
  <!-- Right pupil -->
  <rect x="51" y="28.5" width="11" height="8" rx="2.5" fill="#312E81"/>
  <!-- Right eye glint -->
  <circle cx="55.5" cy="31.5" r="2.2" fill="white" fill-opacity="0.6"/>

  <!-- Mouth / speaker grille -->
  <rect x="20" y="46" width="40" height="5" rx="2.5" fill="white" fill-opacity="0.82"/>

  <!-- Neck connectors (two pegs) -->
  <rect x="22" y="55" width="11" height="6" rx="2" fill="url(#gDark)"/>
  <rect x="47" y="55" width="11" height="6" rx="2" fill="url(#gDark)"/>

  <!-- Body -->
  <rect x="7" y="60" width="66" height="40" rx="10" fill="url(#gMain)"/>

  <!-- Body top highlight strip -->
  <rect x="7" y="60" width="66" height="11" rx="10" fill="white" fill-opacity="0.07"/>

  <!-- IA panel border -->
  <rect x="14" y="71" width="52" height="20" rx="5" fill="white" fill-opacity="0.11"/>
  <rect x="14" y="71" width="52" height="20" rx="5" fill="none" stroke="white" stroke-opacity="0.28" stroke-width="1"/>
  <!-- IA label -->
  <text x="40" y="85.5" text-anchor="middle" font-size="11" font-weight="800"
        font-family="Inter, -apple-system, 'Segoe UI', Arial, sans-serif"
        fill="white" letter-spacing="2.5">IA</text>

  <!-- Left arm -->
  <rect x="0" y="63" width="8" height="26" rx="4" fill="url(#gMain)"/>
  <!-- Right arm -->
  <rect x="72" y="63" width="8" height="26" rx="4" fill="url(#gMain)"/>

  <!-- Left foot -->
  <rect x="12" y="101" width="22" height="7" rx="3.5" fill="url(#gDark)"/>
  <!-- Right foot -->
  <rect x="46" y="101" width="22" height="7" rx="3.5" fill="url(#gDark)"/>
</svg>
